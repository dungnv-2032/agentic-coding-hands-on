<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SW*-IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Sun* brand palette (assets/sun-brand.md): Sun Red is the single accent — not a flood fill.
     Neutrals softened + shared radius/shadow tokens so every tab shares the wireframe tab's polish. */
  :root { --red:#FF2200; --darkred:#AD0C00; --gold:#B69256; --yellow:#FDBA05;
          --ink:#1B1B20; --mut:#6B6B73; --faint:#9A9AA2; --bd:#E7E7EC; --bd2:#F1F1F4;
          --bg:#FAFAFB; --tint:#FFEEEC; --edit:#FFF6F4;
          --r-lg:8px; --r:6px; --r-sm:4px;
          --sh-sm:0 1px 2px rgba(20,20,30,.05);
          --sh:0 2px 10px rgba(20,20,30,.055),0 1px 3px rgba(20,20,30,.04);
          --sh-lg:0 12px 32px rgba(20,20,30,.12),0 3px 9px rgba(20,20,30,.06); }
  * { box-sizing:border-box; }
  body { font-family:"Noto Sans JP",-apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif; margin:0; color:var(--ink); background:var(--bg);
         line-height:1.65; letter-spacing:.002em; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
  /* left-sidebar navigation shell (header removed) */
  .side { flex:0 0 240px; width:240px; position:sticky; top:0; align-self:flex-start; height:100vh; overflow-y:auto;
          background:#fff; border-right:1px solid var(--bd); padding:24px 16px; display:flex; flex-direction:column; }
  /* フィードバック導線（サイドバー最下部・常設） */
  .side-foot { margin-top:auto; padding:14px 8px 4px; border-top:1px solid var(--bd2); }
  .side-foot a { font-size:11.5px; color:var(--mut); text-decoration:none; }
  .side-foot a:hover { color:var(--red); }
  .side-brand { font-size:21px; font-weight:800; color:var(--ink); letter-spacing:-.01em; padding:0 8px 16px; border-bottom:1px solid var(--bd2); }
  .side-brand .ac { color:var(--red); }
  .side-sub { font-size:11.5px; color:var(--mut); line-height:1.5; padding:0 8px 16px; border-bottom:1px solid var(--bd2); }
  .content { flex:1 1 auto; min-width:0; background:#fff; padding:32px 48px 76px; }
  button { font:inherit; font-size:13px; padding:6px 12px; border:1px solid var(--bd); background:#fff; border-radius:var(--r-sm); cursor:pointer; transition:filter .15s, border-color .15s, box-shadow .15s; }
  button.primary { background:var(--red); color:#fff; border-color:var(--red); }
  button.ghost { color:var(--mut); }
  button:hover { filter:brightness(0.97); }
  button:disabled { opacity:.35; cursor:default; }
  main { display:flex; align-items:stretch; min-height:100vh; }
  h1 { font-size:27px; font-weight:800; letter-spacing:-.02em; margin:0 0 4px; }
  /* section heading: red accent bar + hairline rule (replaces the heavy full-width red underline) */
  h2 { font-size:17px; font-weight:800; color:var(--ink); letter-spacing:-.01em; margin:40px 0 17px; padding-bottom:10px;
       border-bottom:1px solid var(--bd); display:flex; align-items:center; gap:10px; }
  h2::before { content:""; width:4px; height:15px; border-radius:99px; background:var(--red); flex:0 0 auto; }
  .sub { color:var(--mut); font-size:13px; margin:0 0 24px; }
  /* inline editable */
  [contenteditable], .ed { background:transparent; border-radius:4px; padding:1px 4px; transition:background .15s; outline:none; }
  [contenteditable]:hover { background:#faf7f6; box-shadow:inset 0 0 0 1px var(--bd); }
  [contenteditable]:focus { background:var(--edit); box-shadow:inset 0 0 0 1px var(--red); }
  dl { display:grid; grid-template-columns:140px 1fr; gap:4px 16px; margin:0; }
  dt { color:var(--mut); font-size:13px; }
  dd { margin:0; }
  ul.lines { margin:4px 0; padding-left:20px; }
  ul.lines li { margin:1px 0; }
  /* ===== 出典 (input provenance) tooltip: hover an output element → which input it came from ===== */
  .has-src { cursor:help; }
  li.has-src, span.has-src, td.has-src { text-decoration:underline dotted #c4c4cf; text-underline-offset:3px; }
  .src-tip { position:fixed; z-index:9999; max-width:480px; background:#26262b; color:#fff; font-size:13.5px; line-height:1.7;
    border-radius:8px; padding:10px 14px 12px; box-shadow:0 6px 20px rgba(0,0,0,.28); pointer-events:none;
    opacity:0; transition:opacity .12s; }
  .src-tip.on { opacity:1; }
  .src-tip .src-h { display:block; font-size:10.5px; font-weight:700; letter-spacing:.1em; color:#ff9d8c; margin-bottom:3px; white-space:nowrap; }
  .src-tip .src-loc { font-size:12.5px; font-weight:700; color:#d6d6de; margin-top:7px; }
  .src-tip .src-loc::before { content:"📄 "; font-size:11px; }
  /* 該当部分（インプット原文の抜粋）: 引用ブロックとして本文を見せる */
  .src-tip .src-q { margin:5px 0 1px; padding:7px 12px; background:rgba(255,255,255,.09); border-left:2px solid #ff5f49;
    border-radius:0 5px 5px 0; color:#fff; font-size:13.5px; line-height:1.7; white-space:pre-line; }
  /* ===== visual sitemap tree (vertical, branching, card-based) ===== */
  .sm-tree { margin:6px 0 2px; }
  .sm-tree ul { list-style:none; margin:0; }  /* .sm-screens sets its own padding-left for indentation */
  .sm-root { position:relative; }
  /* root → sections: spine descends from the root icon, each section branches off via an elbow */
  .sm-sections { position:relative; margin:10px 0 0; padding:6px 0 0 50px; }
  .sm-sections::before { content:""; position:absolute; left:25px; top:-8px; height:26px; border-left:2px solid var(--bd); }
  .sm-sec { position:relative; padding:0; margin:0 0 16px; }
  .sm-sec::before { content:""; position:absolute; left:-25px; top:0; height:25px; width:25px; border-left:2px solid var(--bd); border-bottom:2px solid var(--bd); border-bottom-left-radius:9px; }
  .sm-sec:not(:last-child)::after { content:""; position:absolute; left:-25px; top:0; bottom:-16px; border-left:2px solid var(--bd); }
  .node { position:relative; border-radius:6px; border:1px solid var(--bd); background:#fff; box-shadow:var(--sh-sm); transition:box-shadow .15s ease, border-color .15s ease, transform .15s ease; }
  .node-row { display:flex; align-items:center; gap:9px; padding:8px 13px; }
  .node-ico { flex:0 0 auto; width:26px; height:26px; border-radius:4px; display:flex; align-items:center; justify-content:center; background:var(--bg); }
  .node-title { font-weight:700; font-size:13px; color:var(--ink); flex:1 1 auto; }
  .node-sum { font-size:11px; color:var(--mut); line-height:1.5; padding:0 13px 9px 48px; margin-top:-2px; }
  .node-badge { flex:0 0 auto; font-size:10.5px; font-weight:700; color:var(--mut); background:var(--bg); border:1px solid var(--bd); border-radius:99px; padding:1px 9px; }
  .node.root { display:inline-block; min-width:300px; max-width:560px; background:var(--red); border-color:var(--red); box-shadow:0 2px 6px rgba(255,34,0,.18); }
  .node.root .node-ico { background:rgba(255,255,255,.16); }
  .node.root .node-ico .ic { color:#fff; }
  .node.root .node-title { color:#fff; font-size:14px; }
  .node.root .node-sum { color:#ffd9d2; }
  .node.section { background:#fff; max-width:560px; }
  .node.section .node-row { padding:9px 14px; }
  .node.section .node-ico { background:var(--tint); }
  .node.section .node-ico .ic { color:var(--red); }
  .node.section .node-title { font-size:13.5px; }
  .node.section .node-badge { color:var(--darkred); background:var(--tint); border-color:transparent; }
  /* parent node → its child screens: the spine descends from directly UNDER the parent's (folder) icon.
     --ind = child indent; --spine = x of the vertical line (aligned to the parent icon centre). */
  .sm-screens { list-style:none; position:relative; margin:0 0 6px; padding:0 0 2px var(--ind,46px); --spine:22px; }
  .sm-sec > .sm-screens { --spine:27px; }          /* section folder icon centre */
  .sm-screens .sm-screens { --spine:22px; }        /* nested screen folder icon centre */
  .sm-screens > li { position:relative; padding:5px 0; }
  /* elbow: vertical drop from the spine + horizontal segment reaching the child card */
  .sm-screens > li::before { content:""; position:absolute; left:calc(var(--spine) - var(--ind,46px)); top:-2px; height:24px; width:calc(var(--ind,46px) - var(--spine)); border-left:2px solid var(--bd); border-bottom:2px solid var(--bd); border-bottom-left-radius:9px; }
  /* continuation spine to the next sibling */
  .sm-screens > li:not(:last-child)::after { content:""; position:absolute; left:calc(var(--spine) - var(--ind,46px)); top:-2px; bottom:-10px; border-left:2px solid var(--bd); }
  /* a parent screen reads as a container: folder-tinted icon + the spine visibly leaves its underside */
  .node.screen-node.parent .node-ico { background:var(--tint); }
  .node.screen-node.parent .node-ico .ic { color:var(--red); }
  .node.screen-node.parent .node-kids { flex:0 0 auto; font-size:10px; font-weight:700; color:var(--mut); background:var(--bg); border:1px solid var(--bd); border-radius:99px; padding:1px 8px; margin-left:6px; }
  .node.screen-node { max-width:540px; border-left:3px solid var(--bd); cursor:default; }
  .node.screen-node .node-row { padding:8px 11px; gap:8px; }
  .node.screen-node .node-ico { width:23px; height:23px; background:var(--bg); }
  .node.screen-node .node-ico .ic { color:var(--ink); }
  .node.screen-node .node-title { font-size:12.5px; }
  .node.screen-node .node-sum { font-size:10.5px; padding:0 11px 9px 42px; line-height:1.45; }
  .node.screen-node:hover { border-color:var(--red); border-left-color:var(--red); box-shadow:0 3px 9px rgba(0,0,0,.08); transform:translateY(-1px); }
  .node.screen-node:hover .node-ico { background:var(--tint); }
  .node.screen-node:hover .node-ico .ic { color:var(--red); }
  .node.screen-node.prio-must   { border-left-color:var(--red); }
  .node.screen-node.prio-should { border-left-color:var(--gold); }
  .node.screen-node.prio-could  { border-left-color:var(--bd); }
  /* progressively de-emphasize deeper levels so fine hierarchy reads at a glance */
  .sm-screens .sm-screens .node.screen-node { max-width:510px; background:#fcfcfd; }
  .sm-screens .sm-screens .node.screen-node .node-title { font-size:12px; }
  .sm-screens .sm-screens .node.screen-node .node-ico { width:21px; height:21px; }
  .sm-screens .sm-screens .sm-screens .node.screen-node { max-width:482px; background:#fafafb; }
  /* list view: concise per-page info inline (主操作 + 情報優先度 chips) */
  .node.screen-node.sl { max-width:680px; }
  .sm-screens .sm-screens .node.screen-node.sl,
  .sm-screens .sm-screens .sm-screens .node.screen-node.sl { max-width:660px; background:#fff; }
  .sl-prio { flex:0 0 auto; font-size:9px; font-weight:800; border-radius:99px; padding:1px 8px; text-transform:uppercase; letter-spacing:.03em; }
  .sl-prio.must   { background:#ffe7e1; color:#c41d00; }
  .sl-prio.should { background:#f4ecd9; color:#8a6d2f; }
  .sl-prio.could  { background:#eeeef1; color:#777; }
  .sl-meta { display:flex; flex-wrap:wrap; gap:5px; align-items:center; padding:0 12px 8px 48px; margin-top:-2px; }
  .sl-act { font-size:10.5px; font-weight:700; color:#fff; background:var(--red); border-radius:5px; padding:1px 9px; }
  .sl-ip { font-size:10.5px; color:var(--ink); background:var(--bg); border:1px solid var(--bd); border-radius:99px; padding:1px 9px; }
  .sl-ip .rk { font-size:9px; font-weight:800; margin-right:5px; color:var(--red); }
  .sl-ip.t2 .rk { color:#9a9aa6; }
  .sl-ip.t3 .rk { color:#bcbcc6; }
  .sm-empty { font-size:11px; color:var(--mut); margin:9px 0 0 2px; padding:6px 11px; border:1px dashed var(--bd); border-radius:4px; background:var(--bg); display:inline-block; }
  /* ===== visual sitemap: mini-wireframe nodes + curved SVG connectors (flow-diagram style) ===== */
  .vsm { position:relative; overflow:auto; padding:12px 2px 20px; }
  .vsm-canvas { position:relative; display:inline-block; min-width:100%; }
  .vsm-links { position:absolute; left:0; top:0; z-index:0; pointer-events:none; overflow:visible; }
  .vsm-node { display:flex; flex-direction:column; align-items:center; position:relative; z-index:1; }
  .vsm-children { display:flex; gap:22px; align-items:flex-start; margin-top:38px; }
  .vsm-card { position:relative; background:#fff; border:1px solid var(--bd); border-radius:8px; padding:7px 7px 8px; width:128px; box-shadow:0 1px 3px rgba(0,0,0,.06); transition:box-shadow .15s, transform .15s, border-color .15s; }
  .vsm-card:hover { border-color:var(--red); box-shadow:0 4px 12px rgba(0,0,0,.10); transform:translateY(-1px); }
  .vsm-card-top { display:flex; align-items:center; gap:5px; margin-bottom:5px; }
  .vsm-num { font-size:10px; font-weight:800; color:var(--red); letter-spacing:.02em; }
  .vsm-card-top .ic { width:13px; height:13px; color:var(--mut); }
  .vsm-name { font-size:10.5px; font-weight:700; color:var(--ink); text-align:center; line-height:1.3; margin-top:6px; }
  .vsm-thumb.wire-frame { width:114px !important; height:74px !important; max-width:none; border-width:1px; padding:3px; gap:2px; margin:0 auto; }
  .vsm-thumb .wblock { font-size:0 !important; padding:0; border-style:solid; border-color:#e8e8f0; background:#f2f2f7; min-height:3px; }
  .vsm-card.p-must   { border-top:3px solid var(--red); }
  .vsm-card.p-should { border-top:3px solid var(--gold); }
  .vsm-card.p-could  { border-top:3px solid var(--bd); }
  .vsm-card.is-root { background:var(--red); border-color:var(--red); width:auto; min-width:148px; box-shadow:0 2px 8px rgba(255,34,0,.22); }
  .vsm-card.is-root:hover { transform:none; }
  .vsm-root-t { color:#fff; font-weight:800; font-size:13px; text-align:center; padding:5px 10px; }
  .vsm-card.is-section { background:var(--tint); border-color:transparent; width:auto; min-width:138px; }
  .vsm-sec-h { display:flex; align-items:center; gap:6px; justify-content:center; }
  .vsm-sec-ic .ic { width:14px; height:14px; color:var(--red); }
  .vsm-sec-t { font-size:12px; font-weight:800; color:var(--darkred); }
  .vsm-sec-c { font-size:10px; color:var(--darkred); text-align:center; margin-top:2px; opacity:.8; }
  .vsm-pill { position:absolute; transform:translate(-50%,-50%); background:#fff; border:1px solid var(--bd); border-radius:99px; font-size:9.5px; color:var(--mut); padding:1px 7px; white-space:nowrap; z-index:2; box-shadow:0 1px 2px rgba(0,0,0,.05); }
  .vsm-hint { font-size:11px; color:var(--mut); margin:2px 0 0; }
  .sm-toggle { display:inline-flex; border:1px solid var(--bd); border-radius:8px; overflow:hidden; margin:2px 0 10px; }
  .sm-tgl { font:inherit; font-size:12px; padding:5px 15px; border:none; background:#fff; color:var(--mut); cursor:pointer; transition:background .12s, color .12s; }
  .sm-tgl + .sm-tgl { border-left:1px solid var(--bd); }
  .sm-tgl.on { background:var(--red); color:#fff; font-weight:700; }
  .sm-tgl:not(.on):hover { background:var(--bg); }
  /* decision-oriented screen list table */
  .screen-table { width:100%; border-collapse:collapse; font-size:13px; }
  .screen-table th { text-align:left; font-size:10px; color:var(--faint); font-weight:700; letter-spacing:.07em; text-transform:uppercase; border-bottom:1px solid var(--bd); padding:10px 12px; }
  .screen-table td { border-bottom:1px solid var(--bd2); padding:12px 12px; vertical-align:top; }
  .screen-table td.nm { font-weight:700; min-width:120px; }
  .screen-table tr:hover td { background:var(--bg); }
  /* screen cards grid */
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(248px,1fr)); gap:14px; margin:6px 0; }
  .screen { border:1px solid var(--bd); border-left-width:5px; border-radius:var(--r); padding:14px 16px; background:#fff; box-shadow:var(--sh-sm); transition:box-shadow .15s, border-color .15s; }
  .screen:hover { box-shadow:var(--sh); }
  .screen .top { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
  .screen .name { font-weight:700; font-size:15px; flex:1 1 100%; }
  select.badge { font:inherit; font-size:11px; padding:2px 7px; border-radius:99px; border:1px solid var(--bd); background:var(--bg); color:var(--darkred); cursor:pointer; }
  .role-tag { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--mut); }
  .chips { display:flex; flex-wrap:wrap; gap:4px; margin:4px 0; }
  .chip { font-size:10.5px; background:var(--bg); color:var(--mut); border:1px solid var(--bd); border-radius:99px; padding:1px 8px; }
  .meta-line { font-size:12px; color:var(--mut); margin:5px 0 1px; }
  .flow { font-family:ui-monospace,Menlo,monospace; font-size:13px; }
  .flow .arrow { color:var(--mut); }
  /* simple wireframe (built from layoutBlocks) */
  .wire { margin:6px 0 2px; }
  .wire-frame { background:#fff; border:1.5px solid var(--ink); border-radius:3px; padding:5px; display:flex; flex-direction:column; gap:4px; }
  .wire-frame.portrait { width:132px; height:232px; }
  .wire-frame.landscape { width:100%; max-width:220px; height:150px; }
  .wblock { background:var(--bg); border:1px dashed #bbb; border-radius:3px; font-size:9px; line-height:1.25; color:var(--mut); display:flex; align-items:center; justify-content:center; text-align:center; padding:2px 4px; overflow:hidden; }
  .wire-frame.large.portrait { width:220px; height:400px; }
  .wire-frame.large.landscape { width:100%; max-width:320px; height:212px; }
  .wire-frame.large .wblock { font-size:11px; }
  .wire-gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:24px; align-items:start; margin:6px 0; }
  .wire-card { display:flex; flex-direction:column; gap:8px; align-items:center; }
  .wire-head { width:100%; display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .wire-name { font-weight:700; font-size:14px; }
  /* ===== HI-FI mock — navy + greyscale, soft-rounded cards (health-app tone) ===== */
  :root{
    --w-navy:#3A4A66; --w-navy-d:#2E3A52; --w-navy-soft:#EEF1F6;
    --w-ink:#2F3A52; --w-mut:#9AA1AD; --w-faint:#B9BFC9;
    --w-line:#EDEEF2; --w-line2:#F3F4F7; --w-bg:#F3F4F7; --w-card:#FFFFFF;
    --w-r-lg:8px; --w-r:6px; --w-r-sm:5px; --w-r-xs:4px;
    --w-sh-sm:0 1px 2px rgba(46,58,82,.05);
    --w-sh:0 4px 14px rgba(46,58,82,.06),0 1px 3px rgba(46,58,82,.05);
    --w-sh-lg:0 14px 38px rgba(46,58,82,.14),0 3px 10px rgba(46,58,82,.07);
  }
  .hf-frame{ background:var(--w-bg); border-radius:34px; overflow:hidden;
    display:flex; flex-direction:column; position:relative;
    border:7px solid #1E2435; box-shadow:var(--w-sh-lg); letter-spacing:-.003em; color:var(--w-ink); }
  /* ===== device frames (mobile / tablet / desktop) ===== */
  .hf-frame.dev-mobile{ width:300px; height:600px; }
  .hf-frame.dev-tablet{ width:420px; height:560px; border-radius:26px; border-width:9px; }
  .hf-frame.dev-desktop{ width:100%; max-width:720px; height:460px; border-radius:12px; border:1px solid var(--w-line); box-shadow:var(--w-sh-lg); }
  .hf-frame.dev-desktop .hf-body{ background:var(--w-bg); }
  .hf-frame.dev-desktop .hf-cards{ grid-template-columns:1fr 1fr; }
  /* desktop = left sidebar nav + main column (business/admin layout) */
  .hf-deskshell{ flex:1; display:flex; min-height:0; }
  .hf-sidenav{ flex:0 0 150px; width:150px; max-width:150px; box-sizing:border-box; background:var(--w-card); border-right:1px solid var(--w-line); display:flex; flex-direction:column; padding:14px 10px; overflow:hidden; }
  .hf-sidenav .logo{ display:flex; align-items:center; gap:8px; min-width:0; font-size:12px; font-weight:800; color:var(--w-ink); letter-spacing:-.01em; padding:2px 6px 12px; border-bottom:1px solid var(--w-line); margin-bottom:8px; }
  .hf-sidenav .logo .mark{ width:22px; height:22px; border-radius:7px; background:var(--w-navy); display:flex; align-items:center; justify-content:center; color:#fff; flex:0 0 auto; }
  .hf-sidenav .logo .mark .ic{ width:13px; height:13px; }
  .hf-sidenav .logo span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .snav-links{ display:flex; flex-direction:column; gap:3px; flex:1; }
  .snl{ display:flex; align-items:center; gap:9px; font-size:12px; font-weight:600; color:var(--w-mut); padding:8px 10px; border-radius:8px; }
  .snl .ic{ width:15px; height:15px; flex:0 0 auto; }
  .snl.on{ background:var(--w-navy-soft); color:var(--w-navy); }
  .snav-acct{ display:flex; align-items:center; gap:8px; font-size:11px; color:var(--w-mut); padding:8px 8px 2px; border-top:1px solid var(--w-line); }

    box-shadow:0 8px 20px rgba(58,74,102,.4); border:4px solid var(--w-card); }

  .del { color:#b91c1c; border:none; background:none; cursor:pointer; font-size:13px; padding:2px 6px; }
  .addbtn { margin-top:8px; }
  .hint { color:var(--mut); font-size:12px; }
  .editmark { font-size:11px; color:var(--mut); border:1px dashed var(--bd); border-radius:6px; padding:2px 8px; }
  /* tabs */
  .tabs { display:flex; flex-direction:column; gap:2px; margin:14px 0 0; }
  .tab { display:flex; align-items:center; gap:8px; width:100%; text-align:left; justify-content:flex-start;
         border:none; background:none; padding:9px 12px; font-size:13.5px; color:var(--mut);
         border-left:3px solid transparent; border-radius:var(--r-sm); margin:0; transition:background .12s, color .12s; }
  .tab:hover { color:var(--ink); filter:none; background:var(--bd2); }

  .panel { display:none; }

  .count { font-size:11px; color:var(--mut); background:var(--bg); border:1px solid var(--bd); border-radius:99px; padding:0 7px; margin-left:4px; }
  /* overview as a slide deck (Sun* body-slide look) */
  .slide { background:#fff; border:1px solid var(--bd); border-radius:var(--r-lg); padding:30px 38px; min-height:330px; box-shadow:var(--sh); }
  .slide-title { font-size:22px; font-weight:700; color:var(--ink); border-bottom:3px solid var(--red); padding-bottom:9px; margin:0 0 22px; }
  .slide-body dl { grid-template-columns:150px 1fr; gap:8px 18px; font-size:14px; }
  .slabel { font-size:11px; font-weight:700; letter-spacing:.04em; color:var(--mut); text-transform:uppercase; margin:16px 0 4px; }
  .slide-nav { display:flex; align-items:center; justify-content:center; gap:16px; margin-top:16px; }
  .slide-nav > button { width:42px; font-size:15px; }
  .slide-count { font-size:12px; color:var(--mut); min-width:52px; text-align:center; }
  .dots { display:flex; gap:7px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--bd); cursor:pointer; border:none; padding:0; }
  .dot.on { background:var(--red); }
  /* overview: stacked 16:9 slides */
  .slide16 { position:relative; min-height:460px; border:1px solid var(--bd); border-radius:var(--r-lg); padding:32px 42px; margin-bottom:24px; box-shadow:var(--sh); overflow:visible; }
  .slide16-num { position:absolute; top:16px; right:20px; font-size:10px; font-weight:700; letter-spacing:.12em; color:#bbb; }
  /* screen list (clean vertical rows) */
  .screen-list { display:flex; flex-direction:column; gap:10px; margin:6px 0; }
  .screen-row { border:1px solid var(--bd); border-radius:var(--r); padding:15px 18px; background:#fff; box-shadow:var(--sh-sm); transition:box-shadow .15s; }
  .screen-row:hover { box-shadow:var(--sh); }
  .row-head { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .row-head .name { font-weight:700; font-size:16px; }
  .row-sum { font-size:12px; color:var(--mut); margin:4px 0 10px; }
  .row-fields { display:grid; grid-template-columns:1fr 1fr; gap:8px 24px; }
  .row-foot { display:flex; flex-wrap:wrap; gap:6px 22px; font-size:12px; color:var(--mut); margin-top:8px; }
  /* ===== ワイヤー tab — two-column detail: left page-hierarchy list + right stage/spec ===== */
  .wf-detail{ display:flex; gap:26px; align-items:flex-start; margin-top:6px; }
  .wf-side{ flex:0 0 236px; position:sticky; top:14px; max-height:calc(100vh - 28px); overflow-y:auto;
    border:1px solid var(--w-line); border-radius:12px; padding:10px 10px 12px; background:var(--w-card); box-shadow:var(--w-sh-sm); scrollbar-width:thin; }

  .wf-side-h{ font-size:10px; font-weight:700; color:var(--w-faint); letter-spacing:.08em; text-transform:uppercase; padding:4px 8px 8px; }
  .wf-main{ flex:1 1 auto; min-width:0; }
  /* section group label inside the list */
  .wf-grouplabel{ font-size:9.5px; font-weight:700; color:var(--w-faint); letter-spacing:.07em; text-transform:uppercase; padding:11px 8px 4px; }
  .wf-grouplabel:first-of-type{ padding-top:2px; }
  /* clickable page row; sub-screens indent + carry a corner connector glyph */
  .wf-litem{ display:flex; align-items:center; gap:8px; width:100%; text-align:left; border:none; background:none; cursor:pointer;
    padding:7px 9px; border-radius:8px; font-size:12.5px; color:var(--w-mut); transition:background .12s, color .12s; line-height:1.35; }
  .wf-litem:hover{ background:var(--w-navy-soft); color:var(--w-navy); }
  .wf-litem.on{ background:var(--w-navy); color:#fff; font-weight:700; box-shadow:0 3px 9px rgba(58,74,102,.28); }
  .wf-litem .ic{ width:14px; height:14px; color:var(--w-navy); flex:0 0 auto; }
  .wf-litem:hover .ic, .wf-litem.on .ic{ color:inherit; }

  .wf-litem .wf-branch{ color:var(--w-faint); font-size:12px; line-height:1; flex:0 0 auto; margin-right:-2px; }
  .wf-litem.on .wf-branch{ color:rgba(255,255,255,.55); }
  @media (max-width:880px){ .wf-detail{ flex-wrap:wrap; } .wf-side{ flex:1 1 100%; position:static; max-height:none; } }
  /* per-screen transition strip — 遷移元 → 現在 → 遷移先 (chips jump to that wireframe) */
  .wf-flow{ display:flex; flex-wrap:wrap; align-items:center; gap:9px; margin:0 0 22px; padding:13px 16px;
    background:var(--w-card); border:1px solid var(--w-line); border-radius:12px; box-shadow:var(--w-sh-sm); }
  .wf-flow .grp{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; }

  .wf-flow .cur{ font-size:12.5px; font-weight:700; color:#fff; background:var(--w-navy); border-radius:8px; padding:5px 12px; }
  .wf-flow .arr{ color:var(--w-faint); font-size:15px; font-weight:700; }
  .wf-tchip{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--w-navy); background:var(--w-navy-soft);

  .wf-flow-empty{ font-size:11px; color:var(--w-faint); }
  .wf-stage{ display:flex; justify-content:center; padding:14px 0 36px;
    background:radial-gradient(ellipse 60% 50% at 50% 40%,rgba(58,74,102,.07),transparent 70%); }

  .wf-stage .hf-frame.dev-tablet{ width:480px; height:640px; }
  .wf-stage .hf-frame.dev-desktop{ width:100%; max-width:860px; height:540px; }
  /* ===== ワイヤー — キャンバス (transition overview) ===== */
  .wfc-bar{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin:2px 0 10px; }
  .wfc-hint{ font-size:11.5px; color:var(--w-mut); line-height:1.5; }

    background:radial-gradient(circle, rgba(58,74,102,.06) 1px, transparent 1px) 0 0/22px 22px, var(--w-bg); }
  .wfc-canvas{ position:relative; min-width:100%; }
  .wfc-links{ position:absolute; left:0; top:0; z-index:0; pointer-events:none; overflow:visible; }
  /* whole-picture transition map (画面遷移) — reuses .wfc container, name-only nodes */
  .fmap{ max-height:66vh; border-radius:8px; }
  .fmap-node{ position:absolute; z-index:1; box-sizing:border-box; display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--bd); border-left:3px solid var(--bd); border-radius:5px; padding:9px 12px; box-shadow:var(--sh-sm); }
  .fmap-node .ic{ width:15px; height:15px; color:var(--mut); flex:0 0 auto; }

  .fmap-node.p-must{ border-left-color:var(--red); } .fmap-node.p-should{ border-left-color:var(--gold); } .fmap-node.p-could{ border-left-color:var(--bd); }
  .wfc-node{ position:absolute; z-index:1; display:flex; flex-direction:column; align-items:center; gap:7px; cursor:pointer; }

  .wfc-node:hover .holder{ transform:translateY(-2px); box-shadow:var(--w-sh-lg); }
  .wfc-node.on .holder{ outline:3px solid var(--w-navy); outline-offset:2px; }
  .wfc-cap{ display:flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--w-ink); max-width:100%; }
  .wfc-cap .ic{ width:13px; height:13px; color:var(--w-navy); flex:0 0 auto; }
  .wfc-cap span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .wf-spec{ border-top:1px solid var(--w-line); padding-top:24px; }

  .wf-title .t{ font-size:17px; font-weight:700; color:var(--w-ink); letter-spacing:-.01em; }
  .wf-rolelabel{ font-size:13px; color:var(--w-mut); margin:0 0 22px; padding-left:27px; }
  /* page purpose — a prominent callout so specs/elements can be judged against the page's intent */
  .wf-purpose{ margin:6px 0 24px; padding:15px 18px; background:var(--w-navy-soft); border-left:4px solid var(--w-navy);
    border-radius:0 12px 12px 0; }
  .wf-purpose-h{ display:flex; align-items:center; gap:7px; font-size:10.5px; font-weight:700; color:var(--w-navy);
    letter-spacing:.07em; text-transform:uppercase; margin-bottom:7px; }
  .wf-purpose-h .ic{ width:14px; height:14px; color:var(--w-navy); }
  .wf-purpose-t{ font-size:14.5px; line-height:1.65; color:var(--w-ink); font-weight:500; }
  .wf-purpose-meta{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .wf-pmeta{ display:inline-flex; align-items:baseline; gap:6px; font-size:11.5px; color:var(--w-ink);
    background:var(--w-card); border:1px solid var(--w-line); border-radius:8px; padding:4px 11px; }
  .wf-pmeta .k{ font-size:9.5px; font-weight:700; color:var(--w-faint); letter-spacing:.04em; }
  .wf-spec-cols{ display:grid; grid-template-columns:1fr 1fr; gap:34px; }
  .wf-h{ font-size:11px; font-weight:700; color:var(--w-faint); letter-spacing:.09em; text-transform:uppercase; margin:2px 0 11px; padding-bottom:7px; border-bottom:1px solid var(--w-line); }
  .wf-list{ list-style:none; margin:0 0 18px; padding:0; }
  .wf-list li{ display:flex; gap:12px; padding:8px 0; border-bottom:1px solid var(--w-line2); font-size:12.5px; align-items:baseline; }
  .wf-list li:last-child{ border-bottom:none; }
  .wf-k{ flex:0 0 90px; color:var(--w-faint); font-size:11.5px; }
  .wf-v{ flex:1; color:var(--w-ink); min-width:0; }
  .wf-v .tag{ display:inline-block; background:var(--w-navy-soft); border:1px solid transparent; border-radius:7px; padding:2px 9px; margin:2px 4px 2px 0; font-size:11.5px; color:var(--w-navy); }
  .wf-v .rank{ display:inline-flex; align-items:center; justify-content:center; width:17px; height:17px; border-radius:50%; background:var(--w-navy); color:#fff; font-size:10px; font-weight:700; margin-right:7px; vertical-align:-3px; }
  .wf-cgroup + .wf-cgroup{ margin-top:18px; }
  .wf-cgroup-h{ font-size:10.5px; font-weight:700; color:var(--w-ink); letter-spacing:.02em; margin:0 0 8px; display:flex; align-items:center; gap:7px; }
  .wf-cgroup-h .badge{ font-size:9px; font-weight:700; color:var(--w-navy); background:var(--w-navy-soft); border-radius:99px; padding:1px 7px; }
  .wf-comp{ list-style:none; margin:0; padding:0; }
  .wf-comp li{ padding:10px 12px; border:1px solid var(--w-line); border-radius:var(--w-r-sm); margin-bottom:7px; background:#fff; box-shadow:var(--w-sh-sm); }

  .wf-comp .clabel{ font-size:12px; font-weight:700; color:var(--w-ink); }
  .wf-comp .citems{ display:block; color:var(--w-mut); font-size:11px; margin-top:6px; line-height:1.55; }
  .wf-comp .citems .dot{ color:var(--w-faint); margin:0 5px; }
  .wf-comp-empty{ font-size:11px; color:var(--w-faint); padding:7px 0; }
  .wf-covers{ margin-top:8px; }
  /* flow (left→right) */
  .flow-h { display:flex; align-items:center; gap:9px; font-size:13px; font-weight:700; letter-spacing:.01em; color:var(--ink); margin:22px 0 10px; }
  .flow-h.sub { color:var(--mut); }
  .flow-h-name { display:inline-flex; align-items:center; gap:7px; }

  .flow-h.sub .flow-h-name::before { background:var(--gold); }
  .flow-h-tag { font-size:9.5px; font-weight:700; letter-spacing:.04em; color:#fff; background:var(--red); border-radius:99px; padding:1px 9px; }

  .flow-strip { display:flex; align-items:center; gap:8px; padding:10px 0 16px; overflow-x:auto; }
  .flow-card { flex:0 0 168px; border:1px solid var(--bd); border-radius:8px; background:#fff; padding:10px; display:flex; flex-direction:column; gap:8px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  /* pure-flow node (no wireframe thumbnail) */

  .flow-cap-role { font-size:10.5px; color:var(--mut); }

  .flow-mini.ghost { height:118px; border:1px dashed var(--bd); border-radius:4px; display:flex; align-items:center; justify-content:center; color:var(--mut); font-size:11px; }
  .flow-cap-t { display:flex; align-items:center; gap:6px; font-weight:700; font-size:12.5px; color:var(--ink); }
  .flow-cap-a { font-size:11px; color:var(--mut); margin-top:3px; }
  .flow-arrow.big .ar { font-size:22px; }
  .flow-node { display:inline-flex; align-items:center; padding:8px 14px; border:1.5px solid var(--ink); border-radius:6px; font-size:13px; background:#fff; white-space:nowrap; }

  .flow-arrow { display:inline-flex; flex-direction:column; align-items:center; color:var(--red); padding:0 2px; }
  .flow-arrow .ar { font-size:18px; line-height:1; }
  .flow-arrow .cond { font-size:9.5px; color:var(--mut); max-width:90px; text-align:center; line-height:1.1; }
  .subflow { display:flex; flex-direction:column; gap:8px; }
  .sub-row { display:flex; align-items:center; gap:8px; }
  .trans-row { display:flex; align-items:center; gap:8px; padding:5px 0; font-size:13px; flex-wrap:wrap; }

  .node.section .node-ico .ic { color:var(--gold); }

  .flow-node .ic { margin-right:6px; color:var(--ink); }
  .flow-node.sub .ic { color:var(--mut); }
  .wf-meta-item .ic { color:var(--ink); }
  .prd-screen-refs .ic { color:var(--mut); }
  /* PRD */

  /* persona avatars + user-story cards */
  .avatar { flex:0 0 auto; width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center; }

  .persona-card { display:flex; gap:13px; align-items:flex-start; border:1px solid var(--bd); border-radius:12px; background:#fff; padding:14px 16px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  .persona-tx { min-width:0; }
  .persona-name { font-weight:700; font-size:14.5px; color:var(--ink); }
  .persona-desc { font-size:12.5px; color:var(--mut); line-height:1.6; margin-top:4px; }

  decide:'<path d="M8 2.6v10.8"/><path d="M3 4.4h10"/><path d="M5 4.6L3.2 8.4a1.8 1.8 0 0 0 3.6 0L5 4.6z"/><path d="M11 4.6L9.2 8.4a1.8 1.8 0 0 0 3.6 0L11 4.6z"/>',
  input:'<path d="M10.8 2.6l2.6 2.6L6 12.6l-3 .4.4-3 7.4-7.4z"/>',

  manage:'<circle cx="8" cy="8" r="2.1"/><path d="M8 1.6v1.8M8 12.6v1.8M1.6 8h1.8M12.6 8h1.8M3.5 3.5l1.3 1.3M11.2 11.2l1.3 1.3M12.5 3.5l-1.3 1.3M4.8 11.2l-1.3 1.3"/>',
  confirm:'<circle cx="8" cy="8" r="6.3"/><path d="M5 8.2l2.1 2.1L11 5.9"/>',

// persona card. Accepts a plain string (compact) or a rich object that captures user-understanding:
// { name, who(どんな人), goal(目的/達成したいこと), context(状況), needs(知る必要), infoOrder(見たい順番),
//   vocabulary(自然な言葉), decisions(迷い・判断) }  — decisions item = string or {point, note}
function personaCard(pn){
  const isObj = pn && typeof pn==="object";
  const sp = isObj ? null : splitPersona(pn);
  const name = isObj ? (pn.name||"ユーザー") : sp.name;
  const who  = isObj ? (pn.who||"") : sp.desc;
  const card=el("div",null,"persona-card"+(isObj?" rich":""));
  const head=el("div",null,"persona-head");
  head.appendChild((isObj && pn.image) ? personaPhoto(pn.image, name, "lg") : personaAvatar(name, isObj?"lg":""));
  const ht=el("div",null,"persona-tx");
  ht.appendChild(el("div",name,"persona-name"));
  if(who) ht.appendChild(el("div",who,"persona-who"));
  head.appendChild(ht); card.appendChild(head);
  withSrc(card, pn);
  if(!isObj) return card;
  // 目的 / 状況
  const meta=el("div",null,"persona-meta");
  const row=(k,v)=>{ if(!v)return; const r=el("div"); r.appendChild(el("span",k,"pm-k")); r.appendChild(el("span",v)); meta.appendChild(r); };
  row("目的",pn.goal); row("状況",pn.context);
  if(meta.childNodes.length) card.appendChild(meta);
  // ユーザー理解の5観点
  const g=el("div",null,"pu-grid");
  const chipCell=(h,arr)=>{ const a=(arr||[]).filter(Boolean); if(!a.length)return; const c=el("div",null,"pu-cell"); c.appendChild(el("div",h,"pu-h")); const ch=el("div",null,"pu-chips"); a.forEach(x=>ch.appendChild(el("span",x,"pu-chip"))); c.appendChild(ch); g.appendChild(c); };
  const orderCell=(h,arr)=>{ const a=(arr||[]).filter(Boolean); if(!a.length)return; const c=el("div",null,"pu-cell"); c.appendChild(el("div",h,"pu-h")); const o=el("div",null,"pu-order"); a.forEach((x,i)=>{ if(i)o.appendChild(el("span","›","pu-arr")); const s=el("span",null,"pu-step"); s.appendChild(el("span",String(i+1),"pu-n")); s.appendChild(el("span",x)); o.appendChild(s); }); c.appendChild(o); g.appendChild(c); };
  const decCell=(h,arr)=>{ const a=(arr||[]).filter(Boolean); if(!a.length)return; const c=el("div",null,"pu-cell wide"); c.appendChild(el("div",h,"pu-h")); const ul=el("ul",null,"pu-dec"); a.forEach(d=>{ const li=el("li"); if(d&&typeof d==="object"){ if(d.point)li.appendChild(el("span",d.point,"pu-pt")); li.appendChild(document.createTextNode(d.note||d.hesitation||"")); } else li.appendChild(document.createTextNode(d)); ul.appendChild(li); }); c.appendChild(ul); g.appendChild(c); };
  chipCell("知りたいこと（何を知る必要があるか）",pn.needs);
  orderCell("見たい順番",pn.infoOrder);
  // 「自然に理解できる言葉」は項目過多のため非表示（データは保持）
  decCell("迷い・判断ポイント",pn.decisions);
  if(g.childNodes.length) card.appendChild(g);
  return card;
}
// short persona name (before the "/", e.g. 「佐藤 幸子 / 55・…調理担当」→「佐藤 幸子」) — used in story contexts
function personaShort(n){ return String(n||"").split(/[\/／]/)[0].trim(); }
// system/app actor icon (monitor glyph) — for non-human lanes like「アプリ（システム）」
function systemAvatar(cls){
  const wrap=el("div",null,"avatar sys"+(cls?" "+cls:""));
  wrap.appendChild(wIcon('<rect x="2" y="3" width="12" height="8" rx="1.2"/><path d="M5.5 13.5h5M8 11v2.5"/>',"0 0 16 16","ic"));
  return wrap;
}
// actor/lane avatar: system lanes → system icon; else a persona photo when the name matches; else a coloured silhouette
function laneAvatar(laneName){
  const n=String(laneName||"");
  if(/システム|アプリ|app|system|ai|自動|バッチ|サーバ|server|api|クラウド|cloud|エンジン/i.test(n)) return systemAvatar("sm");
  const toks=(n.match(/[一-龠ぁ-んァ-ヶ]{2,}|[A-Za-z]{3,}/g)||[]);
  const hit=personaLookupList().find(p=> p.image && p.name && toks.some(t=> p.name.indexOf(t)>=0));
  return (hit&&hit.image) ? personaPhoto(hit.image, hit.name, "sm") : personaAvatar(laneName,"sm");
}
// ---- user-story ↔ persona linking ----
// normalize personas (string or object) to {name, image} for lookup
function personaLookupList(){ return (data.prd&&data.prd.personas||[]).filter(Boolean).map(pn=>{
  if(pn&&typeof pn==="object") return {name:pn.name||"", image:pn.image||""};
  const sp=splitPersona(pn); return {name:sp.name, image:""}; }); }
// leading role token: "出品者 / 田中さん" → "出品者"
function roleToken(s){ return String(s||"").split(/[\/:：|]/)[0].trim(); }
// resolve a story's persona reference (index number, name, or role keyword) to a persona
function findStoryPersona(ref){
  const list=personaLookupList(); if(!list.length||ref==null||ref==="") return null;
  if(typeof ref==="number") return list[ref]||null;
  const r=roleToken(ref); if(!r) return null;
  return list.find(p=>{ const t=roleToken(p.name); return t&&(t===r||t.includes(r)||r.includes(t)); })
       || list.find(p=>p.name&&(p.name.includes(r)||r.includes(p.name))) || null;
}
// parse a story (string "〜として、〜したい。なぜなら〜" OR object { as/role, want/text, why/reason, persona })
function storyParse(s){
  if(s && typeof s==="object"){
    const as=s.as||s.role||"";
    return { roleDisplay: as?(as+"として、"):"", body:s.want||s.text||s.story||"", why:s.why||s.reason||"",
             ref:(s.persona!=null && s.persona!=="")?s.persona:as };
  }
  const mt=String(s).match(/^(.+?)(として[、,]?)(.*)$/);
  if(mt){ const parts=String(mt[3]).split(/。?\s*なぜなら\s*/); return { roleDisplay:mt[1]+mt[2], body:(parts[0]||"").replace(/[。.]\s*$/,""), why:parts[1]||"", ref:mt[1] }; }
  const parts=String(s).split(/。?\s*なぜなら\s*/); return { roleDisplay:"", body:parts[0]||String(s), why:parts[1]||"", ref:String(s) };
}
// flatten a story (string or object) to a single readable sentence (for plain-text contexts like the journey)
function storyText(s){
  const {roleDisplay, body, why}=storyParse(s);
  return (roleDisplay+body) + (why ? ("。なぜなら "+String(why).replace(/^なぜなら\s*/,"")) : "");
}
// one story row. grouped=true omits the leading avatar + 👤 name (the persona group header carries them).
function storyItemEl(s, grouped){
  const li=el("li",null,"story-item"+(grouped?" grouped":""));
  const {roleDisplay, body, why, ref}=storyParse(s);
  const pe=findStoryPersona(ref);
  if(!grouped) li.appendChild(pe&&pe.image ? personaPhoto(pe.image, pe.name||roleDisplay, "sm") : personaAvatar(roleDisplay||body, "sm"));
  const tx=el("div",null,"story-tx");
  if(roleDisplay) tx.appendChild(el("span", roleDisplay, "story-role"));
  if(body) tx.appendChild(document.createTextNode(body));
  if(why) tx.appendChild(el("div","なぜなら "+String(why).replace(/^なぜなら\s*/,""), "story-why"));
  if(!grouped && pe&&pe.name) tx.appendChild(el("div","👤 "+personaShort(pe.name), "story-pname"));
  li.appendChild(tx); return withSrc(li, s);
}
// group stories by their resolved persona (persona-list order first, then unmatched). Returns [{pe, items}].
function storyGroups(stories){
  const groups=new Map();
  stories.forEach(s=>{ const pe=findStoryPersona(storyParse(s).ref); const key=pe?pe.name:"__none__";
    if(!groups.has(key)) groups.set(key,{pe, items:[]}); groups.get(key).items.push(s); });
  const ordered=[];
  personaLookupList().forEach(p=>{ if(groups.has(p.name)){ ordered.push(groups.get(p.name)); groups.delete(p.name); } });
  groups.forEach(g=>ordered.push(g));  // remaining incl. unmatched
  return ordered;
}

/* ---------- small helpers (read-only viewer: edits are made via Claude Code) ---------- */
function el(tag, text, cls){const e=document.createElement(tag); if(text!=null)e.textContent=text; if(cls)e.className=cls; return e;}
// static text (signature kept for callers; onSave ignored — viewer is read-only)
function ed(tag, val, onSave, cls){ return el(tag, val||"", cls); }
// static list, one <li> per item (items may be strings or { text, sources } objects)
function edList(arr, onSave){ const ul=el("ul",null,"lines"); (arr||[]).filter(Boolean).forEach(v=>ul.appendChild(withSrc(el("li",itemText(v)),v))); return ul; }

/* ---------- 出典 (input provenance): hover an output → tooltip shows which input it came from ---------- */
// list items may be plain strings or { text, sources } objects — always read text via itemText()
function itemText(v){ return (v&&typeof v==="object") ? String(v.text||v.item||v.name||v.title||"") : (v==null?"":String(v)); }
// normalize x.sources / x.source (string | object | array) → [{line, quote}]
function srcOf(v){
  if(!v||typeof v!=="object") return [];
  let s=(v.sources!=null)?v.sources:v.source; if(s==null) return [];
  if(!Array.isArray(s)) s=[s];
  return s.filter(Boolean).map(x=>{
    if(typeof x!=="object") return {line:String(x), quote:""};
    const line=[x.doc||x.file||"", x.section||x.heading||""].filter(Boolean).join(" › ")||x.note||"";
    return {line, quote:String(x.quote||x.excerpt||"")};
  }).filter(x=>x.line||x.quote);
}
// attach provenance to a rendered node; no-op when the spec item carries no sources
function withSrc(node, v){
  const list=srcOf(v); if(!list.length) return node;
  node.classList.add("has-src");
  node.dataset.src=JSON.stringify(list);   // structured: tooltip renders 場所 + 該当部分(引用) separately
  return node;
}
// one shared floating tooltip (position:fixed → survives overflow:auto containers like tables/strips)
(function(){
  let tip=null;
  const hide=()=>{ if(tip) tip.classList.remove("on"); };
  document.addEventListener("mouseover", e=>{
    const t=(e.target&&e.target.closest)?e.target.closest(".has-src"):null;
    if(!t){ hide(); return; }
    if(!tip){ tip=el("div",null,"src-tip"); document.body.appendChild(tip); }
    tip.textContent="";
    tip.appendChild(el("span","出典（インプット）","src-h"));
    let items=[]; try{ items=JSON.parse(t.dataset.src||"[]"); }catch(err){ items=[{line:t.dataset.src||"", quote:""}]; }
    items.forEach(x=>{
      if(x.line)  tip.appendChild(el("div",x.line,"src-loc"));   // どの文書のどこか
      if(x.quote) tip.appendChild(el("div",x.quote,"src-q"));    // 該当部分（原文の抜粋）
    });
    tip.classList.add("on");
    const r=t.getBoundingClientRect();
    tip.style.left="0px"; tip.style.top="0px";           // reset before measuring
    const tw=tip.offsetWidth, th=tip.offsetHeight;
    const x=Math.min(Math.max(8, r.left), Math.max(8, window.innerWidth-tw-8));
    const y=(r.top-th-8>=8)?(r.top-th-8):(r.bottom+8);
    tip.style.left=x+"px"; tip.style.top=y+"px";
  });
  document.addEventListener("scroll", hide, true);
})();

let activeTab = "prd";  // preserved across re-renders (add/remove screen, etc.)

function render(){
  const doc=document.getElementById("doc"); doc.innerHTML="";

  const tabs=[
    {id:"prd",      label:"PRD",        build:buildPRD},
    {id:"journey",  label:"ジャーニー",   build:buildJourney},
    {id:"bizflow",  label:"業務フロー",   build:buildBusinessFlow, count:()=>(data.businessFlow&&data.businessFlow.steps||[]).length},
    {id:"storymap", label:"ストーリーマップ", build:buildStoryMap},
    {id:"structure",label:"情報構造",     build:buildStructure},
    {id:"sitemap",  label:"サイトマップ", build:buildSitemap},
    {id:"screens",  label:"画面一覧",     build:buildScreens, count:()=>data.screens.length},
    {id:"flow",     label:"画面遷移",     build:buildFlow,    count:()=>data.transitions.length},
    {id:"wires",    label:"ワイヤー",     build:buildWireframes, count:()=>data.screens.length},
  ];

  // left sidebar (product title + vertical nav) | right content (panels)
  const side=el("div",null,"side");
  const brand=el("div",null,"side-brand"); brand.innerHTML='SW<span class="ac">*</span>-IA'; side.appendChild(brand);
  const bar=el("div",null,"tabs"); side.appendChild(bar);
  const content=el("div",null,"content");
  const panels=[];
  tabs.forEach(t=>{
    const b=el("button",t.label,"tab"); b.dataset.tab=t.id;
    if(t.count) b.appendChild(el("span",String(t.count()),"count"));
    b.onclick=()=>activate(t.id);
    bar.appendChild(b);
    const p=el("div",null,"panel"); p.dataset.panel=t.id; t.build(p); panels.push(p); content.appendChild(p);
  });
  // フィードバック導線: スキル改善アンケートへの常設リンク（控えめにサイドバー最下部）
  const foot=el("div",null,"side-foot");
  const fb=document.createElement("a");
  fb.href="https://github.com/sun-asterisk-internal/takumi-design/issues";
  fb.target="_blank"; fb.rel="noopener"; fb.textContent="フィードバックを送る ↗";
  foot.appendChild(fb); side.appendChild(foot);
  doc.appendChild(side); doc.appendChild(content);

  function activate(id){ activeTab=id;
    bar.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.tab===id));
    panels.forEach(p=>p.classList.toggle("active",p.dataset.panel===id));
    // rebuild derived views from latest data when entering their tab
    if(id==="sitemap"){ const sp=panels.find(p=>p.dataset.panel==="sitemap"); sp.innerHTML=""; buildSitemap(sp); }
    if(id==="wires"){ const wp=panels.find(p=>p.dataset.panel==="wires"); wp.innerHTML=""; buildWireframes(wp); }
    if(id==="flow"){ const fp=panels.find(p=>p.dataset.panel==="flow"); fp.innerHTML=""; buildFlow(fp); }
    if(id==="journey"){ const jp=panels.find(p=>p.dataset.panel==="journey"); jp.innerHTML=""; buildJourney(jp); }
    if(id==="prd"){ const pp=panels.find(p=>p.dataset.panel==="prd"); pp.innerHTML=""; buildPRD(pp); }
    if(id==="structure"){ const cp=panels.find(p=>p.dataset.panel==="structure"); cp.innerHTML=""; buildStructure(cp); }
    if(id==="bizflow"){ const bp=panels.find(p=>p.dataset.panel==="bizflow"); bp.innerHTML=""; buildBusinessFlow(bp); }
    if(id==="storymap"){ const mp=panels.find(p=>p.dataset.panel==="storymap"); mp.innerHTML=""; buildStoryMap(mp); }
  }
  activate(tabs.some(t=>t.id===activeTab)?activeTab:"prd");
}

// Journey: integrate PRD goals/stories → main-flow screens (left→right, with mini wireframe,
// info, action, states) → KPI/risks. One end-to-end view of the user experience.
function ctxCols(pairs){ // pairs: [ [title, items[]], ... ]

// concise "want" clause of a story (drop the 〜として role prefix and the なぜなら reason)
function storyWant(s){ const {body}=storyParse(s); return String(body).split(/。?\s*なぜなら/)[0].replace(/[。.]\s*$/,"").trim(); }
function journeyStep(s,n){

function buildJourney(p){
  const prd=ensurePRD();
  p.appendChild(el("h2","ユーザージャーニー"));
  p.appendChild(el("p","PRDのゴール／ストーリーから、メインフローの画面を順にたどり、各画面の体験（情報・操作・状態）と成果(KPI)までを一望します。","hint"));
  // prominent goal callout
  const goals=(prd.goals||[]).filter(Boolean);
  if(goals.length){ const g=el("div",null,"j-goal"); g.appendChild(el("div","ゴール","j-goal-h"));
    const ul=el("ul",null,"j-goal-list"); goals.forEach(x=>ul.appendChild(withSrc(el("li",itemText(x)),x))); g.appendChild(ul); p.appendChild(g); }
  // user stories as a left→right strip (same direction as the flow, so they read together)
  const stories=(prd.userStories||[]).filter(Boolean);
  if(stories.length){
    p.appendChild(el("div","ユーザーストーリー","flow-h"));
    const strip=el("div",null,"j-story-strip");
    stories.forEach((s,i)=>{ const pr=storyParse(s); const pe=findStoryPersona(pr.ref);
      const c=el("div",null,"j-story-card");
      const head=el("div",null,"j-sc-head");
      head.appendChild(pe&&pe.image ? personaPhoto(pe.image, pe.name||"", "sm") : personaAvatar(pr.roleDisplay||pr.body||String(i),"sm"));
      if(pe&&pe.name) head.appendChild(el("span", personaShort(pe.name), "j-sc-name"));
      c.appendChild(head);
      c.appendChild(el("div", storyWant(s), "j-sc-want"));
      if(pr.why) c.appendChild(el("div","なぜなら "+String(pr.why).replace(/^なぜなら\s*/,""), "j-sc-why"));
      strip.appendChild(withSrc(c, s)); });
    p.appendChild(strip);
  }

  const main=data.transitions.filter(t=>t.kind!=="sub");
  const byId=Object.fromEntries(data.screens.map(s=>[s.id,s]));
  let order=(main.length? orderFlow(main): data.screens.map(s=>s.id)).filter(id=>byId[id]);
  if(!order.length){ p.appendChild(el("p","画面と遷移を追加すると、ここに体験の流れが表示されます。","hint")); }
  else {
    p.appendChild(el("div","メインフロー","flow-h"));
    const track=el("div",null,"j-track");
    order.forEach((id,idx)=>{ track.appendChild(journeyStep(byId[id],idx+1));
      if(idx<order.length-1){ const e=main.find(x=>x.from===order[idx]&&x.to===order[idx+1]); const ar=el("div",null,"flow-arrow j-arrow"); if(e&&e.condition)ar.appendChild(el("span",e.condition,"cond")); ar.appendChild(el("span","→","ar")); track.appendChild(ar); } });
    p.appendChild(track);
    // sub-flows = exception / branch experiences (e.g. 差し戻し)
    const sub=data.transitions.filter(t=>t.kind==="sub");
    if(sub.length){
      p.appendChild(el("div","分岐・例外フロー","flow-h sub"));
      const w=el("div",null,"subflow");
      sub.forEach(t=>{ const row=el("div",null,"sub-row"); row.appendChild(flowNodeEl(t.from,"sub"));
        const ar=el("span",null,"flow-arrow"); if(t.condition)ar.appendChild(el("span",t.condition,"cond")); ar.appendChild(el("span","→","ar")); row.appendChild(ar);
        row.appendChild(flowNodeEl(t.to,"sub")); w.appendChild(row); });
      p.appendChild(w);
    }
  }
  const bottom=ctxCols([["成功指標 (KPI)",prd.metrics],["リスク・前提",prd.risks]]); if(bottom) p.appendChild(bottom);
}

// Traceability matrix: functional requirements (rows) × screens (cols); ● where screen.covers includes the req.
// Surfaces requirement gaps (uncovered reqs) — core IA value.
function buildTraceability(prd){
  const reqs=(prd.functionalReqs||[]).filter(Boolean);
  if(!reqs.length || !data.screens.length) return null;
  const box=el("div");
  const wrap=el("div",null,"trace-scroll"); const tb=el("table",null,"trace-table");
  const head=el("tr"); head.appendChild(el("th","機能要件 \\ 画面"));
  data.screens.forEach(s=>head.appendChild(el("th", s.name||s.id||"画面"))); tb.appendChild(head);
  const uncovered=[];
  reqs.forEach(rq=>{ const rqT=itemText(rq); const tr=el("tr"); tr.appendChild(withSrc(el("td",rqT),rq)); let any=false;
    data.screens.forEach(s=>{ const has=(s.covers||[]).includes(rqT); if(has)any=true; const td=el("td",has?"●":""); if(has)td.className="hit"; tr.appendChild(td); });
    if(!any) uncovered.push(rqT); tb.appendChild(tr); });
  wrap.appendChild(tb); box.appendChild(wrap);
  if(uncovered.length){ const w=el("div",null,"trace-warn"); w.textContent="⚠ どの画面にも紐づかない要件: "+uncovered.join(" / "); box.appendChild(w); }
  return box;
}

const BF_TYPE={start:"開始",action:"操作",decision:"分岐",system:"システム",end:"完了"};

  } else {

    (cs.categories||[]).forEach(c=>{
      const col=el("div",null,"cs-col");
      const h=el("div",null,"cs-h"); h.appendChild(el("span",c.name||"")); h.appendChild(el("span",String((c.cards||[]).length),"cs-count")); col.appendChild(h);
      (c.cards||[]).filter(Boolean).forEach(x=>col.appendChild(withSrc(el("div",itemText(x),"cs-card"),x)));
      if(c.rationale) col.appendChild(el("div",c.rationale,"cs-why"));
      board.appendChild(withSrc(col, c));
    });
    if((cs.unsorted||[]).length){
      const col=el("div",null,"cs-col unsorted");
      const h=el("div",null,"cs-h"); h.appendChild(el("span","未分類")); h.appendChild(el("span",String(cs.unsorted.length),"cs-count")); col.appendChild(h);
      cs.unsorted.filter(Boolean).forEach(x=>col.appendChild(el("div",x,"cs-card")));
      board.appendChild(col);

  p.appendChild(el("h2","オブジェクトモデル"));
  if(!data.objects.length){
    p.appendChild(el("p","情報の中心となるオブジェクト（例: 顧客・商談・見積・契約・請求）と、その主要属性・親子/関連を整理します。`objects` を指定すると関係図が表示されます。","hint"));
    return;
  }
  // build child map from relations (has-many/has-one). roots = objects never referenced as a child.
  const byName=Object.fromEntries(data.objects.map(o=>[o.name,o]));
  const childOf={}; const isChild=new Set();
  data.objects.forEach(o=>(o.relations||[]).forEach(r=>{ if(r.kind!=="relates"){ (childOf[o.name]=childOf[o.name]||[]).push(r); if(byName[r.to])isChild.add(r.to); } }));
  const roots=data.objects.filter(o=>!isChild.has(o.name));
  const wrap=el("div",null,"obj-tree"); const seen=new Set();
  const renderObj=(o, relLabel)=>{
    const li=el("li");

  wrap.appendChild(rootUl); p.appendChild(wrap);
  p.appendChild(el("p","親子（1:N / 1:1）はツリーで、その他のつながりは各カードの「関連」で表現しています。","hint"));
}

// build one swimlane grid from {lanes, steps}
function swimlaneGrid(lanesIn, steps){
  let lanes=(lanesIn||[]).filter(Boolean);
  if(!lanes.length){ const seen=new Set(); steps.forEach(s=>{ const l=s.lane||"フロー"; if(!seen.has(l)){seen.add(l); lanes.push(l);} }); }
  const laneIdx=Object.fromEntries(lanes.map((l,i)=>[l,i]));
  const grid=el("div",null,"bf-grid");
  grid.style.gridTemplateColumns="132px repeat("+steps.length+",minmax(168px,1fr))";
  lanes.forEach((l,i)=>{
    const band=el("div",null,"bf-band"+(i%2?" alt":"")); band.style.gridColumn="1 / -1"; band.style.gridRow=String(i+1); grid.appendChild(band);
    const lab=el("div",null,"bf-lane"); lab.appendChild(laneAvatar(l)); lab.appendChild(el("span",l,"bf-lane-name"));
    lab.style.gridColumn="1"; lab.style.gridRow=String(i+1); grid.appendChild(lab);
  });
  steps.forEach((s,i)=>{
    const li=laneIdx[s.lane]!=null?laneIdx[s.lane]:0;
    const cell=el("div",null,"bf-step "+(s.type||"action"));
    cell.style.gridColumn=String(i+2); cell.style.gridRow=String(li+1);
    cell.appendChild(el("span",String(i+1),"bf-num"));
    const body=el("div",null,"bf-body");

    if(s.type&&s.type!=="action") body.appendChild(el("span",BF_TYPE[s.type]||s.type,"bf-tag "+s.type));
    if(s.branch) body.appendChild(el("div",s.branch,"bf-branch"));
    cell.appendChild(body);
    grid.appendChild(withSrc(cell, s));
  });
  return grid;
}

// ===== ストーリーマップ tab: backbone activities → tasks → stories sliced by release =====
// flatten activities → ordered task columns
function smTasks(acts){ const tasks=[]; (acts||[]).forEach(a=>(a.tasks||[]).forEach(t=>tasks.push({act:a.name||"",task:t.name||"",stories:t.stories||[]}))); return tasks; }
// release bands (explicit, else derived from stories, else MVP)
function smReleases(sm, tasks){ let r=(sm.releases||[]).filter(Boolean);
  if(!r.length){ const seen=new Set(); tasks.forEach(t=>t.stories.forEach(s=>{ const x=s.release||"未分類"; if(!seen.has(x)){seen.add(x); r.push(x);} })); }
  return r.length?r:["MVP"]; }
// build one story-map grid (activities × tasks columns × release rows)
function storyMapGrid(tasks, releases){
  const grid=el("div",null,"sm-map");
  grid.style.gridTemplateColumns="104px repeat("+tasks.length+",minmax(146px,1fr))";
  const corner=el("div",null,"sm-corner"); corner.style.gridColumn="1"; corner.style.gridRow="1 / span 2"; grid.appendChild(corner);
  let i=0;
  while(i<tasks.length){ let j=i; while(j+1<tasks.length && tasks[j+1].act===tasks[i].act) j++;
    const a=el("div",tasks[i].act,"sm-act"); a.style.gridColumn=(i+2)+" / span "+(j-i+1); a.style.gridRow="1"; grid.appendChild(a); i=j+1; }
  tasks.forEach((t,k)=>{ const th=el("div",t.task,"sm-task"); th.style.gridColumn=String(k+2); th.style.gridRow="2"; grid.appendChild(th); });
  releases.forEach((rel,ri)=>{
    const rl=el("div",null,"sm-rel"+(ri===0?" mvp":"")); rl.appendChild(el("span",rel)); rl.style.gridColumn="1"; rl.style.gridRow=String(ri+3); grid.appendChild(rl);
    tasks.forEach((t,k)=>{
      const cell=el("div",null,"sm-cell"); cell.style.gridColumn=String(k+2); cell.style.gridRow=String(ri+3);
      t.stories.filter(s=>(s.release||"未分類")===rel).forEach(s=>{
        const card=el("div",null,"sm-story"+(s.priority?" p-"+s.priority:""));
        card.appendChild(el("span",s.title||"","sm-st"));
        if(s.priority) card.appendChild(el("span",s.priority,"sm-pri"));
        cell.appendChild(withSrc(card, s));
      });
      grid.appendChild(cell);
    });
  });
  return grid;
}
function buildStoryMap(p){
  const sm=ensureStoryMap();
  p.appendChild(el("h2","ユーザーストーリーマップ"));
  const acts=sm.activities||[];
  if(!acts.length){
    p.appendChild(el("p","ユーザーの大きな活動（バックボーン）→ タスク → ストーリーを `userStoryMap`（activities[].tasks[].stories[]）で整理します。各 activity に `persona` を付けるとペルソナごとのマップに分割、各ストーリーに release（MVP 等）/ priority を付けるとリリース帯でスライス表示されます。","hint"));
    return;
  }
  // split into per-persona maps when any activity declares a persona; else a single shared map
  const anyPersona=acts.some(a=>a.persona!=null && a.persona!=="");
  if(anyPersona){
    const groups=new Map();
    acts.forEach(a=>{ const pe=findStoryPersona(a.persona); const key=pe?pe.name:"__none__";
      if(!groups.has(key)) groups.set(key,{pe, acts:[]}); groups.get(key).acts.push(a); });
    const ordered=[]; personaLookupList().forEach(x=>{ if(groups.has(x.name)){ ordered.push(groups.get(x.name)); groups.delete(x.name); } });
    groups.forEach(g=>ordered.push(g));
    const releases=smReleases(sm, smTasks(acts));  // shared release bands across personas
    ordered.forEach(g=>{
      const head=el("div",null,"story-group-head sm-persona-head");
      if(g.pe){ head.appendChild(g.pe.image ? personaPhoto(g.pe.image, g.pe.name, "sm") : personaAvatar(g.pe.name, "sm")); head.appendChild(el("span", personaShort(g.pe.name), "story-group-name")); }
      else { head.appendChild(personaAvatar("?", "sm")); head.appendChild(el("span","共通 / 未分類","story-group-name")); }
      p.appendChild(head);
      const tasks=smTasks(g.acts);
      if(tasks.length) p.appendChild(storyMapGrid(tasks, releases));
      else p.appendChild(el("p","このペルソナの activities に tasks がありません。","hint"));
    });
  } else {
    const tasks=smTasks(acts);
    if(!tasks.length){ p.appendChild(el("p","activities[].tasks が空です。","hint")); return; }
    p.appendChild(storyMapGrid(tasks, smReleases(sm, tasks)));
  }
  p.appendChild(el("p","横軸＝ユーザー行動の流れ（アクティビティ→タスク）、縦軸＝リリースのスライス。上の帯ほど先に出す MVP。`activities[].persona` 指定時はペルソナごとに分割表示。","hint"));
}

// Top-down sitemap tree: Product → nav sections → screens.
function buildSitemap(p){
  p.appendChild(el("h2","サイトマップ"));
  const sections=(data.navigation.global||[]);
  const screens=data.screens||[];
  if(!screens.length && !sections.length){
    p.appendChild(el("p","`navigation.global` にナビを、`screens` に画面を指定すると、ここに階層図が表示されます。","hint"));
    return;
  }
  // view toggle: フロー図 (mini-wireframe diagram) ↔ リスト (indented tree, no thumbnails)
  const tog=el("div",null,"sm-toggle");
  const mkTgl=(id,label)=>{ const b=el("button",label,"sm-tgl"+(sitemapView===id?" on":"")); b.onclick=()=>{ if(sitemapView!==id){ sitemapView=id; const sp=document.querySelector('[data-panel="sitemap"]'); if(sp){ sp.innerHTML=""; buildSitemap(sp); } } }; return b; };
  tog.appendChild(mkTgl("flow","フロー図")); tog.appendChild(mkTgl("list","リスト"));
  p.appendChild(tog);

  // shared hierarchy maps (screens[].parent = parent screen id; nesting at any depth)
  const byId=Object.fromEntries(screens.map(s=>[s.id,s]));
  const childrenOf={};
  screens.forEach(s=>{ if(s.parent && byId[s.parent]){ (childrenOf[s.parent]=childrenOf[s.parent]||[]).push(s); } });
  const isChild=s=> s.parent && byId[s.parent];
  const tops=screens.filter(s=>!isChild(s));
  const subtreeCount=s=>{ let n=1; (childrenOf[s.id]||[]).forEach(k=>n+=subtreeCount(k)); return n; };

  if(sitemapView==="list"){
    // ---- indented hierarchy tree with concise per-page info inline ----
    window.__vsmRedraw=null;
    const wrap=el("div",null,"sm-tree");
    const root=el("div",null,"sm-root");
    root.appendChild(treeNode(icon("root"), data.meta.product||"Product", "", "root"));
    const secWrap=el("div",null,"sm-sections");
    const seen=new Set(); const placed=new Set();
    const renderSection=(title,scs)=>{
      const sec=el("div",null,"sm-sec");
      const total=scs.reduce((a,s)=>a+subtreeCount(s),0);

function drawVsmLinks(canvas, svg, links){
  const cr=canvas.getBoundingClientRect();
  const W=canvas.scrollWidth, H=canvas.scrollHeight;
  svg.setAttribute("width",W); svg.setAttribute("height",H); svg.setAttribute("viewBox","0 0 "+W+" "+H);
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  canvas.querySelectorAll(".vsm-pill").forEach(n=>n.remove());
  const NS="http://www.w3.org/2000/svg";
  links.forEach(l=>{
    if(!l.p||!l.c) return;
    const pr=l.p.getBoundingClientRect(), ch=l.c.getBoundingClientRect();
    const px=pr.left-cr.left+pr.width/2, py=pr.bottom-cr.top;
    const cx=ch.left-cr.left+ch.width/2, cy=ch.top-cr.top;
    const dy=Math.max(18, cy-py);
    const d="M"+px+","+py+" C"+px+","+(py+dy*0.5)+" "+cx+","+(cy-dy*0.5)+" "+cx+","+cy;
    const path=document.createElementNS(NS,"path"); path.setAttribute("d",d); path.setAttribute("fill","none");
    path.setAttribute("stroke", l.kind==="root"?"#FF2200":(l.kind==="main"?"#b9b9c6":"#cfcfd9"));

    path.setAttribute("stroke-linecap","round");
    svg.appendChild(path);
    if(l.label){ const pill=el("div", l.label, "vsm-pill"); pill.style.left=((px+cx)/2)+"px"; pill.style.top=((py+cy)/2)+"px"; canvas.appendChild(pill); }
  });
}

// Each layoutBlock is classified into a component type, then rendered as a styled widget.
function inferType(b){
  const n=b||"";
  if(/ヘッダー|header|トップバー|topbar|appbar/i.test(n)) return "header";
  if(/タブ|tab|セグメント|segment/i.test(n)) return "tabs";
  if(/ナビ|nav|メニュー|menu/i.test(n)) return "tabs";
  if(/検索|search|フィルタ|filter/i.test(n)) return "search";
  if(/フォーム|form|入力|input|登録|編集|edit|設定/i.test(n)) return "form";
  if(/カレンダー|calendar|月間|週間|日程/i.test(n)) return "calendar";
  if(/テーブル|table|表/i.test(n)) return "table";
  if(/一覧|リスト|list|明細|履歴|フィード|feed/i.test(n)) return "list";
  if(/サマリ|summary|ダッシュ|dashboard|カード|card|指標|kpi|stat|統計/i.test(n)) return "cards";
  if(/ボタン|送信|アクション|action|button|cta|確定|承認|保存|submit/i.test(n)) return "button";
  if(/画像|image|メディア|media|プレビュー|preview|地図|map|サムネ|thumb|バナー|banner/i.test(n)) return "image";
  if(/フッター|footer/i.test(n)) return "footer";
  return "text";
}
// Build components from layoutBlocks; assign the screen's infoPriority (its display items) to the first content block.
function inferComponents(s){
  const out=[]; const blocks=(s.layoutBlocks&&s.layoutBlocks.length)?s.layoutBlocks:["コンテンツ"];
  const info=(s.infoPriority&&s.infoPriority.length)?s.infoPriority:null; let mainUsed=false;
  const takeInfo=()=>{ if(!mainUsed&&info){ mainUsed=true; return info; } return null; };
  // when items aren't authored, fall back to semantic labels (not 項目1/列1) so sampleValue can fill realistic content
  blocks.forEach(b=>{ const t=inferType(b);
    if(t==="form")  out.push({type:"form",  label:b, items:takeInfo()||["氏名","メールアドレス","カテゴリ","詳細"]});
    else if(t==="list")  out.push({type:"list",  label:b, items:takeInfo()||["新着の項目","処理中の項目","完了した項目"]});
    else if(t==="table") out.push({type:"table", label:b, items:takeInfo()||["名称","状態","更新日","進捗"]});
    else if(t==="cards") out.push({type:"cards", label:b, items:takeInfo()||["合計件数","今月の実績","達成率"]});
    else if(t==="button")out.push({type:"button",label:s.primaryAction||b});
    else if(t==="text")  out.push({type:"text",  label:b, items:takeInfo()});
    else out.push({type:t, label:b});
  });
  return out;
}

// deterministic mini sparkline (area + line + end dot) seeded by a hash — for stat cards
function sparkline(seed, up){
  const W=100,H=26,n=7; let h=seed>>>0; const rnd=()=>{ h=(h*1103515245+12345)>>>0; return (h%1000)/1000; };
  const ys=[]; for(let i=0;i<n;i++){ ys.push(4+rnd()*(H-8)); }
  if(up){ ys[n-1]=Math.min(...ys)-1; } else { ys[n-1]=Math.max(...ys)+1; }  // nudge end to match trend
  const pts=ys.map((y,i)=>[ (i*(W/(n-1))).toFixed(1), y.toFixed(1) ]);
  const line=pts.map(p=>p.join(",")).join(" ");
  const area=`0,${H} `+line+` ${W},${H}`;
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("class","hf-spark"); svg.setAttribute("viewBox","0 0 "+W+" "+H); svg.setAttribute("preserveAspectRatio","none");
  svg.innerHTML='<polyline class="area" points="'+area+'"/><polyline points="'+line+'"/>'+
    '<circle cx="'+pts[n-1][0]+'" cy="'+pts[n-1][1]+'" r="2.4"/>';
  return svg;
}

}
function bottomTabBar(s){

  return bar;
}

function buildHiFi(s, device){
  const dev=device||deviceClass();
  const f=el("div",null,"hf-frame dev-"+dev);
  const comps=(s.components&&s.components.length)?s.components:inferComponents(s);
  const isDesktop=dev==="desktop";
  const isWeb=screenPlatform(s)==="web";  // Web画面: アプリのナビ枠でなくブラウザ/トップナビで描画
  const buildBody=()=>{ const mid=el("div",null,"hf-body"); const stack=el("div",null,"hf-stack"); mid.appendChild(stack);
    comps.forEach(co=>{ if(co.type==="header"||co.type==="footer") return; const n=compEl(co); if(n) stack.appendChild(n); }); return mid; };
  // standalone = 認証/スプラッシュ等、ログイン前の画面。アプリのナビ枠（サイドバー/ステータスバー/下タブ）を描画しない
  const standalone=(s.standalone===true);
  // standalone画面はナビが無いぶん、自身の header コンポーネントのラベル（ブランド名等）をヘッダーに表示する
  const hc=(s.components||[]).find(c=>c&&c.type==="header");
  const headerTitle=(standalone&&hc&&hc.label)?hc.label:(s.name||data.meta.product||"App");
  if(isDesktop){
    if(isWeb){
      // desktop web = トップナビ型のWebサイトレイアウト（アプリ用サイドバーは描画しない）
      if(!standalone) f.appendChild(topNav(s));
      f.appendChild(screenHeader(headerTitle, "", standalone));
      f.appendChild(buildBody());
      return f;
    }
    // desktop app = left sidebar nav + main column (header + body) — no top nav / browser chrome
    const shell=el("div",null,"hf-deskshell"); if(!standalone) shell.appendChild(sideNav(s));
    const mainCol=el("div",null,"hf-deskmain");
    mainCol.appendChild(screenHeader(headerTitle, "", standalone));
    mainCol.appendChild(buildBody());
    shell.appendChild(mainCol); f.appendChild(shell); return f;
  }
  // mobile / tablet
  if(!standalone) f.appendChild(statusBar());
  if(isWeb&&!standalone) f.appendChild(browserBar());  // Web画面はブラウザのURLバーで区別
  // no rationale subtitle inside the mock — the page purpose lives in the spec panel below, keeping the UI clean
  f.appendChild(screenHeader(headerTitle, "", standalone));
  f.appendChild(buildBody());
  if(!standalone&&!isWeb) f.appendChild(bottomTabBar(s));  // 下タブ＋FABはアプリ画面のみ
  return f;
}

const DEV_DIM={mobile:[300,600],tablet:[420,560],desktop:[720,460]};
const DEV_SCALE={mobile:0.52,tablet:0.46,desktop:0.34};
const CANVAS_SCALE={mobile:0.34,tablet:0.32,desktop:0.30};
// ワイヤーのキャンバス俯瞰: 全画面を左→右のフロー層に配置し、transitions を矢印で結ぶ。
function buildWireCanvas(p, dev){
  const NS="http://www.w3.org/2000/svg";
  // platform フィルタ後の画面のみ配置（遷移もフィルタ内の画面同士だけ残る）
  const screens=(data.screens||[]).filter(s=>wirePlatform==="all"||screenPlatform(s)===wirePlatform);
  const [W,H]=DEV_DIM[dev]||DEV_DIM.mobile;
  const scale=CANVAS_SCALE[dev]||0.32;
  const nodeW=Math.round(W*scale), nodeH=Math.round(H*scale), capH=26;
  const colGap=150, rowGap=46, pad=32;
  const edges=(data.transitions||[]).filter(t=>t&&t.from&&t.to);
  const idset=new Set(screens.map(s=>s.id));
  const ids=screens.map(s=>s.id);
  // layer = BFS distance from entry screens → left→right flow. Cycle-safe: back-edges (loops to HOME etc.)
  // don't inflate layers, so nodes always start at the left instead of being pushed off-canvas.

function drawCanvasArrows(canvas, svg, edges, nodeById){
  const NS="http://www.w3.org/2000/svg";
  const cr=canvas.getBoundingClientRect();
  const W=canvas.scrollWidth||canvas.offsetWidth, H=canvas.scrollHeight||canvas.offsetHeight;
  svg.setAttribute("width",W); svg.setAttribute("height",H); svg.setAttribute("viewBox","0 0 "+W+" "+H);
  [...svg.querySelectorAll("path.edge")].forEach(n=>n.remove());
  canvas.querySelectorAll(".wfc-pill").forEach(n=>n.remove());
  edges.forEach(e=>{
    const a=nodeById[e.from], b=nodeById[e.to]; if(!a||!b) return;
    const ah=(a.querySelector(".holder")||a).getBoundingClientRect();
    const bh=(b.querySelector(".holder")||b).getBoundingClientRect();
    const aL=ah.left-cr.left, aR=ah.right-cr.left, aMy=ah.top-cr.top+ah.height/2, aB=ah.bottom-cr.top;
    const bL=bh.left-cr.left, bR=bh.right-cr.left, bMy=bh.top-cr.top+bh.height/2, bB=bh.bottom-cr.top;
    let d, lx, ly;
    if(bL >= aR-6){ // forward → smooth S-curve from source right to target left
      const sx=aR, sy=aMy, tx=bL, ty=bMy, dx=Math.max(52,(tx-sx)*0.5);
      d="M"+sx+","+sy+" C"+(sx+dx)+","+sy+" "+(tx-dx)+","+ty+" "+tx+","+ty; lx=(sx+tx)/2; ly=(sy+ty)/2;
    } else { // back / same-column → arc under both nodes (bottom → bottom), avoids crossing cards

      d="M"+sx+","+sy+" C"+sx+","+(sy+dip)+" "+tx+","+(ty+dip)+" "+tx+","+ty; lx=(sx+tx)/2; ly=Math.max(sy,ty)+dip*0.62;
    }
    const path=document.createElementNS(NS,"path"); path.setAttribute("class","edge"); path.setAttribute("d",d);
    path.setAttribute("fill","none"); path.setAttribute("stroke", e.kind==="sub"?"#c2c8d2":"#94a0b2");
    path.setAttribute("stroke-width", e.kind==="sub"?"1.5":"1.8"); if(e.kind==="sub") path.setAttribute("stroke-dasharray","4 5");
    path.setAttribute("stroke-linecap","round"); path.setAttribute("marker-end","url(#wfc-arrow)");
    svg.appendChild(path);

  });
}
// Depth-first order of screens grouped by section (mirrors the sitemap): yields {s, depth, group, idx}.
function screenTreeOrder(){
  const screens=data.screens||[];
  const byId=Object.fromEntries(screens.map(s=>[s.id,s]));
  const childrenOf={};
  screens.forEach(s=>{ if(s.parent&&byId[s.parent]) (childrenOf[s.parent]=childrenOf[s.parent]||[]).push(s); });
  const isChild=s=>s.parent&&byId[s.parent];
  const tops=screens.filter(s=>!isChild(s));
  const out=[], seen=new Set();
  const walk=(s,depth,group)=>{ if(seen.has(s.id))return; seen.add(s.id);
    out.push({s,depth,group,idx:screens.indexOf(s)});
    (childrenOf[s.id]||[]).forEach(k=>walk(k,depth+1,group)); };
  const placed=new Set();
  (data.navigation.global||[]).forEach(name=>{ tops.filter(s=>(s.section||"")===name).forEach(s=>{ placed.add(s.id); walk(s,0,name); }); });
  tops.filter(s=>!placed.has(s.id)).forEach(s=>walk(s,0,UNCLASSIFIED));
  return out;
}

  const groups=[]; const idx={};
  edges.forEach(e=>{ const nm=(e.flow&&String(e.flow).trim())||defaultLabel; const named=!!(e.flow&&String(e.flow).trim());
    if(idx[nm]==null){ idx[nm]=groups.length; groups.push({name:nm, named, edges:[]}); } groups[idx[nm]].edges.push(e); });
  groups.forEach(g=>{
    const head=el("div",null,"flow-h"+(isSub?" sub":""));
    head.appendChild(el("span", g.name, "flow-h-name"));
    head.appendChild(el("span", isSub?"サブ":"メイン", "flow-h-tag"));
    p.appendChild(head);
    // a named flow reads as a sequence (strip); an unnamed sub bucket may hold disjoint branches → rows
    if(isSub && !g.named){
      const wrap=el("div",null,"subflow");
      g.edges.forEach(t=>{ const row=el("div",null,"sub-row");
        row.appendChild(flowCard(t.from));
        const ar=el("div",null,"flow-arrow big"); if(t.condition)ar.appendChild(el("span",t.condition,"cond")); ar.appendChild(el("span","→","ar")); row.appendChild(ar);
        row.appendChild(flowCard(t.to)); wrap.appendChild(row); });
      p.appendChild(wrap);
    } else {
      p.appendChild(flowStrip(g.edges));
    }
  });
}
// whole-picture transition map: every screen once, all transitions as arrows (BFS layered left→right)
function buildFlowMap(p){
  const NS="http://www.w3.org/2000/svg";
  const screens=data.screens||[]; const edges=(data.transitions||[]).filter(t=>t&&t.from&&t.to);
  if(!screens.length||!edges.length) return;
  const ids=screens.map(s=>s.id); const idset=new Set(ids);
  const adj={}; edges.forEach(e=>{ if(idset.has(e.from)&&idset.has(e.to)) (adj[e.from]=adj[e.from]||[]).push(e.to); });
  const indeg={}; ids.forEach(id=>indeg[id]=0); edges.forEach(e=>{ if(idset.has(e.to)&&idset.has(e.from)) indeg[e.to]++; });
  let entries=ids.filter(id=>indeg[id]===0); if(!entries.length) entries=[ids[0]];
  const layer={}; const q=[]; entries.forEach(id=>{ layer[id]=0; q.push(id); });
  while(q.length){ const u=q.shift(); (adj[u]||[]).forEach(v=>{ if(layer[v]===undefined){ layer[v]=layer[u]+1; q.push(v); } }); }
  ids.forEach(id=>{ if(layer[id]===undefined) layer[id]=0; });
  const byLayer={}; screens.forEach(s=>{ const L=layer[s.id]||0; (byLayer[L]=byLayer[L]||[]).push(s); });
  const layers=Object.keys(byLayer).map(Number).sort((a,b)=>a-b);
  const nodeW=156, nodeH=52, colGap=190, rowGap=58, pad=32;
  p.appendChild(el("div","全体遷移マップ","flow-h"));
  p.appendChild(el("p","全画面と全遷移を1枚で俯瞰（左→右＝流れ、点線＝サブ遷移、ラベル＝条件）。","hint"));
  const wrap=el("div",null,"wfc fmap"); const canvas=el("div",null,"wfc-canvas");
  const svg=document.createElementNS(NS,"svg"); svg.setAttribute("class","wfc-links");
  svg.innerHTML='<defs><marker id="wfc-arrow" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="7" refY="5" orient="auto"><path d="M2.5,2 L7,5 L2.5,8" fill="none" stroke="#94a0b2" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>';
  canvas.appendChild(svg);
  const nodeById={}; let maxX=0,maxY=0;
  layers.forEach(L=>{ byLayer[L].forEach((s,ri)=>{
    const x=pad+L*(nodeW+colGap), y=pad+ri*(nodeH+rowGap);
    const node=el("div",null,"fmap-node"+(["must","should","could"].includes((s.priority||"").toLowerCase())?" p-"+(s.priority||"").toLowerCase():""));
    node.style.left=x+"px"; node.style.top=y+"px"; node.style.width=nodeW+"px";
    node.appendChild(roleIconEl(s.role)); node.appendChild(el("span", s.name||s.id, "fmap-name"));
    canvas.appendChild(node); nodeById[s.id]=node; maxX=Math.max(maxX,x+nodeW); maxY=Math.max(maxY,y+nodeH);
  }); });
  canvas.style.width=(maxX+pad)+"px"; canvas.style.height=(maxY+pad)+"px";
  wrap.appendChild(canvas); p.appendChild(wrap);
  const draw=()=>drawCanvasArrows(canvas, svg, edges, nodeById);
  requestAnimationFrame(()=>requestAnimationFrame(draw));
  window.__fmapRedraw=draw;
  if(!window.__fmapResizeBound){ window.__fmapResizeBound=true; let to; window.addEventListener("resize",()=>{ clearTimeout(to); to=setTimeout(()=>{ if(window.__fmapRedraw)window.__fmapRedraw(); },120); }); }
}
function buildFlow(p){
  p.appendChild(el("h2","画面遷移（ユーザーフロー）"));
  if(!data.transitions.length){ p.appendChild(el("p","遷移が未定義です。","hint")); return; }
  buildFlowMap(p);  // whole-picture map first
  const main=data.transitions.filter(t=>t.kind!=="sub");
  const sub =data.transitions.filter(t=>t.kind==="sub");
  if(main.length) renderFlowGroups(p, main, "メインフロー", false);
  if(sub.length)  renderFlowGroups(p, sub,  "サブフロー",  true);
}

function transRow(t,i){
  const r=el("div",null,"trans-row");
  r.appendChild(ed("span",t.from,v=>{t.from=v; reopenFlow();},"ed"));
  r.appendChild(el("span","→","arrow"));
  r.appendChild(ed("span",t.to,v=>{t.to=v; reopenFlow();},"ed"));
  r.appendChild(el("span","条件","trans-k"));
  r.appendChild(ed("span",t.condition,v=>{t.condition=v; reopenFlow();},"ed"));
  r.appendChild(badge(t.kind||"main",["main","sub"],v=>{t.kind=v; reopenFlow();}));
  const del=el("button","✕","del"); del.onclick=()=>{data.transitions.splice(i,1); render();}; r.appendChild(del);
  return r;
}

render();
</script>
<!-- Agentation visual-feedback toolbar (opt-in). Loads ONLY when the URL has ?annotate=1 (or #annotate),
     so the document stays self-contained & offline by default. When enabled it pulls React + agentation
     from esm.sh and syncs annotations to the local Agentation MCP server, so an AI agent can read your
     visual feedback. Requires internet (for esm.sh) + the MCP server running (default http://localhost:4747). -->
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var on = q.has("annotate") || /(^|[#&])annotate(=|$)/.test(location.hash);
  if(!on) return;
  var endpoint = q.get("endpoint") || "http://localhost:4747";
  function toast(msg,err){ var t=document.createElement("div");
    t.textContent=msg; t.style.cssText="position:fixed;left:12px;bottom:12px;z-index:99999;font:13px/1.5 'Noto Sans JP',sans-serif;"
      +"background:"+(err?"#AD0C00":"#1A1A1A")+";color:#fff;padding:8px 13px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:340px;";
    document.body.appendChild(t); if(!err) setTimeout(function(){ t.style.transition="opacity .5s"; t.style.opacity="0"; setTimeout(function(){t.remove();},600); },4000); }
  toast("注釈モードを読み込み中… (Agentation)");
  (async function(){
    try{
      var [React, ReactDOMClient, mod] = await Promise.all([
        import("https://esm.sh/react@18"),
        import("https://esm.sh/react-dom@18/client"),
        import("https://esm.sh/agentation@3?deps=react@18,react-dom@18")
      ]);
      var Agentation = mod.Agentation || mod.default;
      if(!Agentation) throw new Error("Agentation export not found");
      var mount=document.createElement("div"); mount.id="agentation-root"; document.body.appendChild(mount);
      ReactDOMClient.createRoot(mount).render(
        React.createElement(Agentation, { endpoint: endpoint,
          onSessionCreated:function(id){ console.log("[agentation] session:", id); } })
      );
      var first=document.querySelector("[style*='position:fixed'][style*='bottom:12px']"); if(first) first.remove();
      toast("注釈モード ON — 要素をクリックして注釈、Send で同期 ("+endpoint+")");
    }catch(e){
      console.error("[agentation] load failed:", e);
      toast("Agentation の読み込みに失敗。オンライン接続と MCP サーバ("+endpoint+")を確認してください。", true);
    }
  })();
})();
</script>
